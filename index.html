<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="OccGen project page">
<title>OccGen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --text:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --soft:#f7f8fa;
  --max:960px
}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.65
}
.container{
  width:min(92%,var(--max));
  margin:auto
}
header{
  min-height:88vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:64px 0
}
.venue{
  display:inline-block;
  margin-bottom:18px;
  padding:6px 13px;
  border-radius:999px;
  background:var(--soft);
  color:var(--muted);
  font-size:.92rem;
  font-weight:600
}
h1{
  max-width:920px;
  margin:auto;
  font-size:clamp(2.2rem,5vw,4rem);
  line-height:1.12;
  letter-spacing:-.035em
}
.subtitle{
  max-width:760px;
  margin:18px auto 0;
  color:var(--muted);
  font-size:1.1rem
}
.notice{
  max-width:680px;
  margin:34px auto 0;
  padding:18px 22px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--soft);
  color:#4b5563
}
footer{
  padding:24px 0 32px;
  text-align:center;
  color:var(--muted);
  font-size:.9rem;
  border-top:1px solid var(--line)
}
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="venue">Project Page</div>
    <h1>OccGen</h1>
    <p class="subtitle">Spatial Occupancy-Supervised LiDAR Generation</p>

    <div class="notice">
      This work has not been published yet. Paper, code, method details,
      and experimental results will be released after publication.
    </div>
  </div>
</header>

<footer>
  <div class="container">OccGen Project Page</div>
</footer>
</body>
</html>
